[workspace]
members = ["crates/vagus-plugin-protocol", "crates/vagus-plugin"]
resolver = "2"

[package]
name = "vagus"
version = "0.13.0"
edition = "2024"
rust-version = "1.96"
description = "Local-first PARA second brain: hybrid full-text + semantic search over a Markdown vault"
license = "MIT"
repository = "https://github.com/vasovagal/vagus"
readme = "README.md"
keywords = ["search", "notes", "second-brain", "para", "markdown"]
categories = ["command-line-utilities", "text-processing"]
# Ship only what's needed to build the binary; keep repo-meta (docs, design ADRs,
# Homebrew formula, CI) out of the crates.io tarball. `skills/` stays — it is
# embedded into the binary via include_str! in src/skills.rs.
exclude = [
    "design/",
    "docs/",
    "Formula/",
    "scripts/",
    ".github/",
    "CLAUDE.md",
    "RELEASING.md",
]

[features]
# `generate` ships the tier-1 local generative rewriter (candle + a Qwen3 GGUF). `local-tracing`
# compiles the privacy-projected, local-only tracing integration (ADR 0029). Both ship in official
# builds; `--no-default-features` omits their dependencies and all tracing activation/instrumentation.
default = ["generate", "local-tracing"]
generate = ["dep:candle-core", "dep:candle-transformers", "dep:hf-hub", "dep:tokenizers"]
local-tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:vasovagal-tracing"]

[dependencies]
vagus-plugin-protocol = { path = "crates/vagus-plugin-protocol", version = "0.1.0" }
# Immutable pre-publication pin to the squash-merged shared exporter commit. Replace with a
# reviewed registry dependency before merge (ADR 0029); never use a floating branch or path.
vasovagal-tracing = { git = "https://github.com/vasovagal/vasovagal-tracing", rev = "7afe13e46df63a3767d518ede7b733349dc09b14", optional = true }
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
fastembed = "5.14.0"
pulldown-cmark = "0.13.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tantivy = "0.26.1"
# Embedded HNSW vector index (ADR 0019), statically linked via cxx-build — no cmake, no bindgen, no
# prebuilt download; needs a C++17 toolchain (same class as `ort`). Default features keep the in-binary
# SIMD (`numkong`, runtime CPU-feature dispatch — no dlopen, static-link-safe) and leave `openmp` OFF;
# `openmp` would emit `rustc-link-lib=dylib=omp` and break the self-contained binary (G13). Pinned exact;
# Cargo.lock also pins the transitive `numkong`. Re-verify the artifact with `otool -L`/`ldd` (G13).
usearch = "=2.25.3"
terminal_size = "0.4"
tracing = { version = "0.1.44", optional = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", optional = true, default-features = false, features = ["registry", "std"] }
walkdir = "2.5.0"
# tier-1 local generative rewriter (ADR 0016), behind the `generate` feature. CPU by default (no
# ort/onnxruntime conflict; self-contained binary preserved — G13); macOS additionally enables the
# Metal GPU backend below. hf-hub/tokenizers are pinned to fastembed's lines (0.5 / 0.22) so Cargo
# unifies them — do NOT bump to hf-hub 1.x.
candle-core = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
# sync (ureq) backend only — avoid dragging in hf-hub's async tokio/reqwest extras (fastembed already
# pulls reqwest/native-tls via its own hf-hub feature; we don't need the async stack on top).
hf-hub = { version = "0.5", optional = true, default-features = false, features = ["ureq"] }
tokenizers = { version = "0.22", optional = true }

# macOS: enable candle's Metal backend so the quantized rewriter decodes on the Apple GPU instead of
# the CPU `gemm` (a large speedup for the autoregressive decode — ADR 0016). Cargo feature-unions this
# with the base candle deps above, so it only adds `metal` on macOS; the Linux release targets and the
# `--no-default-features` lean lane compile exactly as before. The binary stays self-contained —
# Metal.framework is a macOS system framework (ADR 0014/G13). Falls back to CPU at runtime if Metal
# can't initialize (see `rewrite::select_device`).
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10.2", optional = true, features = ["metal"] }
candle-transformers = { version = "0.10.2", optional = true, features = ["metal"] }

# Release-binary size/codegen. The shipped v0.13.0 artifact was 55.5 MB on linux-x86_64 under the
# default profile; ~11 MB of that was `.symtab`/`.strtab` symbol names that a released CLI has no use
# for. Stripping and single-CGU ThinLTO cut the artifact without touching what it links: G13's
# self-contained property is about linkage, not symbols, so `otool -L`/`ldd` must still show system
# dylibs only after any change here — re-verify alongside the usual `ort`/usearch/platform bumps.
#   strip          symbol table only; there is no debuginfo in the default release profile anyway.
#                  Costs backtrace quality in release builds (dev/test profiles are untouched).
#   lto/cgu        cross-crate inlining + dedup of the generic instantiations that dominate `.text`
#                  (candle `gemm`, tantivy, serde). Rust-side only — the static C++ (onnxruntime,
#                  usearch) is unaffected, no `-Clinker-plugin-lto`. Buys size at release build time;
#                  `ci.yml` tests on the dev profile and `release.yml` doesn't re-run them (Law 3).
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
