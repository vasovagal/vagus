name: ci

# Law 3: the PR gate. Tests run on PRs (and main pushes); tags do NOT re-run this — a tag trusts
# the green main it was cut from.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy rustfmt
          cache-key: ci
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test (default features)
        run: cargo test --locked
      - name: test (all features)
        run: cargo test --all-features --locked
      - name: test (local-tracing only)
        run: cargo test --no-default-features --features local-tracing --locked
      # Compiled-out tracing/generation must accept their compatibility CLI while reading/creating no
      # tracing state and preserving the existing lean binary.
      - name: test (no default features)
        run: cargo test --no-default-features --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: 1.96.0
          cache-key: ci-msrv-1.96
      - name: test (default features, Rust 1.96)
        run: cargo +1.96.0 test --locked
      - name: check (all features, Rust 1.96)
        run: cargo +1.96.0 check --all-features --locked
      - name: test (local-tracing only, Rust 1.96)
        run: cargo +1.96.0 test --no-default-features --features local-tracing --locked
      - name: test (no default features, Rust 1.96)
        run: cargo +1.96.0 test --no-default-features --locked
