name: release

# Law 3: a tag is a vote of confidence — this workflow does ONLY tag-specific work (build, publish,
# then update the landing-page release pointer and shared Homebrew tap). It does not re-run the PR test matrix. Law 18: one workflow per release event, fanned out by `needs:` only where there's a
# real dependency. Law 19: re-run-safe at every step.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # Law 19: never cancel a half-finished release

permissions:
  contents: write # create the release + upload assets in THIS repo (GITHUB_TOKEN)

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" # Law 7: version lives in the tag

  create-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Create release if absent (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: [check, create-release]
    strategy:
      fail-fast: false # one bad arch shouldn't sink the others (Law 19)
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04-arm # native Linux arm64 (Law 1: native, not qemu)
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-latest # Linux amd64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: rel-${{ matrix.target }}
      - name: Build (native; ort statically links onnxruntime)
        run: cargo build --release --locked
      - name: Package
        id: pkg
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="vagus-${VERSION}-${TARGET}"
          mkdir -p dist
          cp target/release/vagus dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -C dist -czf "${name}.tar.gz" .
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Upload to release (re-run safe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.asset }}" --repo "$GITHUB_REPOSITORY" --clobber

  update-site:
    needs: [check, create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify public release and read publication time
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          info=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,publishedAt,assets)
          [ "$(jq -r .isDraft <<<"$info")" = false ] || {
            echo "::error::landing page cannot advertise a draft release"; exit 1;
          }
          published_at=$(jq -r .publishedAt <<<"$info")
          [ -n "$published_at" ] && [ "$published_at" != null ] || {
            echo "::error::published release has no publishedAt timestamp"; exit 1;
          }
          actual=$(jq -r '.assets[].name' <<<"$info" | LC_ALL=C sort)
          expected=$(printf '%s\n' \
            "vagus-${VERSION}-aarch64-apple-darwin.tar.gz" \
            "vagus-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            "vagus-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | LC_ALL=C sort)
          [ "$actual" = "$expected" ] || {
            echo "::error::public release assets do not match the three-target contract"; exit 1;
          }
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"

      - name: Check out landing page with Vagus-scoped deploy key
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: vasovagal/vasovagal.github.io
          path: landing-page
          ssh-key: ${{ secrets.LANDING_PAGE_DEPLOY_KEY }}

      - name: Set up Node for landing-page checks
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Publish landing-page release state
        run: >-
          landing-page/scripts/publish-release-update.sh
          vagus
          "${{ needs.check.outputs.version }}"
          "${{ steps.release.outputs.published_at }}"

  update-homebrew:
    needs: [check, create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify stable version and public assets
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Skipping non-stable-semver tag: $GITHUB_REF_NAME"
            echo 'stable=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          info=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)
          [ "$(jq -r .isDraft <<<"$info")" = false ] || { echo 'release is draft' >&2; exit 1; }
          actual=$(jq -r '.assets[].name' <<<"$info" | LC_ALL=C sort)
          expected=$(printf '%s\n' \
            "vagus-${VERSION}-aarch64-apple-darwin.tar.gz" \
            "vagus-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            "vagus-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | LC_ALL=C sort)
          [ "$actual" = "$expected" ] || { echo 'public assets do not match contract' >&2; exit 1; }
          echo 'stable=true' >> "$GITHUB_OUTPUT"
      - name: Render formula from public assets
        if: steps.gate.outputs.stable == 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: VERSION="$VERSION" scripts/render-formula.sh > "$RUNNER_TEMP/vagus.rb"
      # Only the shared tap has installation access; mint after validation and rendering.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        if: steps.gate.outputs.stable == 'true'
        id: app
        with:
          client-id: ${{ vars.HOMEBREW_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_PUBLISHER_PRIVATE_KEY }}
          owner: vasovagal
          repositories: homebrew-tap
          permission-contents: write
      - name: Publish formula (bounded concurrent push retry)
        if: steps.gate.outputs.stable == 'true'
        env:
          TAP_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: scripts/publish-homebrew.sh "$VERSION" Formula/vagus.rb "$RUNNER_TEMP/vagus.rb"
